<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>线条小人 · 进场与出场</title>
<style>
  :root { color-scheme: dark; font: 15px system-ui, sans-serif; background: #151619; color: #f3eee2; }
  body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
  main { width: min(960px, calc(100% - 32px)); padding: 24px 0; }
  h1 { margin: 0 0 16px; font-size: 1.15rem; font-weight: 500; }
  canvas { display: block; width: 100%; height: auto; background: radial-gradient(ellipse at 49% 44%, #29292c, #151619 73%); }
  .controls { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  button { min-height: 36px; padding: 0 12px; color: inherit; border: 1px solid #59544c; border-radius: 4px; background: #202124; cursor: pointer; }
  button[aria-pressed="true"] { color: #17181b; background: #e8d9bc; }
  input { flex: 1 1 100px; accent-color: #e8d9bc; }
  output { min-width: 4.5ch; text-align: right; font-variant-numeric: tabular-nums; }
</style>
<main>
  <h1>线条小人 · 进场与出场</h1>
  <canvas id="stage" width="1920" height="1080" aria-label="珍珠白线条小人动效预览"></canvas>
  <div class="controls">
    <button id="intro" type="button" aria-pressed="true">进场</button>
    <button id="outro" type="button" aria-pressed="false">出场</button>
    <button id="play" type="button">播放</button>
    <input id="timeline" type="range" min="0" max="1.875" step="0.001" value="0" aria-label="预览进度">
    <output id="time" for="timeline">0.00 秒</output>
  </div>
</main>
<script src="line-dancer-transitions.js"></script>
<script>
  const presets = globalThis.LineDancerTransitions;
  const stage = document.querySelector('#stage');
  const ctx = stage.getContext('2d');
  const intro = document.querySelector('#intro');
  const outro = document.querySelector('#outro');
  const play = document.querySelector('#play');
  const timeline = document.querySelector('#timeline');
  const time = document.querySelector('#time');
  let draw = presets.drawIntro;
  let animation = 0;
  timeline.max = presets.duration;

  function render(elapsed) {
    ctx.clearRect(0, 0, stage.width, stage.height);
    draw(ctx, elapsed);
    timeline.value = elapsed;
    time.value = elapsed.toFixed(2) + ' 秒';
  }

  function stop() {
    cancelAnimationFrame(animation);
    animation = 0;
    play.textContent = '播放';
  }

  function start() {
    const elapsed = Number(timeline.value);
    const offset = elapsed >= presets.duration ? 0 : elapsed;
    const startTime = performance.now();
    play.textContent = '暂停';
    function tick(now) {
      const seconds = Math.min(presets.duration, offset + (now - startTime) / 1000);
      render(seconds);
      if (seconds === presets.duration) stop();
      else animation = requestAnimationFrame(tick);
    }
    animation = requestAnimationFrame(tick);
  }

  function select(isOutro) {
    stop();
    intro.setAttribute('aria-pressed', String(!isOutro));
    outro.setAttribute('aria-pressed', String(isOutro));
    draw = isOutro ? presets.drawOutro : presets.drawIntro;
    render(0);
  }

  intro.addEventListener('click', () => select(false));
  outro.addEventListener('click', () => select(true));
  play.addEventListener('click', () => animation ? stop() : start());
  timeline.addEventListener('input', () => {
    stop();
    render(Number(timeline.value));
  });
  render(0);
</script>
</html>
